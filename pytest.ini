[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Marker taxonomy — see TESTING_GUIDE.md for the full policy.
markers =
	unit: fast, isolated unit tests for pure compute modules (pipeuhr package)
	integration: Flask test_client HTTP integration tests (webapp routes)
	slow: numerically heavy tests that exercise the SLSQP solver end-to-end
	e2e: end-to-end browser tests via Playwright (requires "playwright install")

; --strict-markers: typo'd @pytest.mark.* names fail loudly instead of being silently ignored.
; --cov targets both the compute core and the Flask layer for a single unified report.
addopts =
	--strict-markers
	-ra
	--cov=pipeuhr
	--cov=webapp
	--cov-report=term-missing
